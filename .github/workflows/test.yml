name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is what a plain Windows install of Node tends to be; 22 is current.
        node: ['20', '22']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No dependencies on purpose: the app ships as one file needing none, and
      # the tests use only what Node brings with it. So there is nothing to install.
      - name: Run the tests
        run: npm test

      - name: Check the built app is in step with src/
        run: |
          npm run build
          git diff --exit-code -- TwilightBooks.html \
            || (echo "TwilightBooks.html is out of date - run: npm run build" && exit 1)
